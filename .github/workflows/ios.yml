name: iOS quality

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Resolve Swift packages
        run: xcodebuild -project ios/ios.xcodeproj -scheme ios -resolvePackageDependencies
      - name: Run unit tests
        run: >-
          xcodebuild -project ios/ios.xcodeproj -scheme ios
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -only-testing:iosTests test
      - name: Run iPhone UI tests
        run: >-
          xcodebuild -project ios/ios.xcodeproj -scheme ios
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -only-testing:iosUITests test
      - name: Run iPad UI tests
        run: >-
          xcodebuild -project ios/ios.xcodeproj -scheme ios
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=latest'
          -only-testing:iosUITests test
      - name: Build iPad simulator without signing
        run: >-
          xcodebuild -project ios/ios.xcodeproj -scheme ios
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Check local secrets
        run: bash ios/scripts/check-no-local-secrets.sh
