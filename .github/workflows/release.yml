name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z format (for example, v1.0.0)." >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  android:
    name: Build signed Android APK
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Android signing key
        id: android-signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/mobile-moodle-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          [[ -s "$keystore_path" ]] || { echo "Decoded Android keystore is empty." >&2; exit 1; }
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Test, lint and assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.android-signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ needs.metadata.outputs.version }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: >-
          ./gradlew --no-configuration-cache
          testDebugUnitTest lintDebug assembleRelease

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          [[ -f "$apk" ]] || { echo "Release APK was not generated." >&2; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          [[ -x "$apksigner" ]] || { echo "Android apksigner was not found." >&2; exit 1; }
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release/android
          cp "$apk" "release/android/mobile-moodle-${GITHUB_REF_NAME}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release/android/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove Android signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mobile-moodle-release.keystore"

  ios:
    name: Build signed iOS IPA
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_BUNDLE_ID: org.moodle.ios
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Resolve pinned Swift packages
        run: >-
          xcodebuild -project ios/ios.xcodeproj -scheme ios
          -onlyUsePackageVersionsFromResolvedFile
          -resolvePackageDependencies

      - name: Run iOS unit tests
        run: >-
          xcodebuild -project ios/ios.xcodeproj -scheme ios
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -onlyUsePackageVersionsFromResolvedFile
          -only-testing:iosTests test

      - name: Install Apple signing assets
        id: ios-signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=(IOS_DISTRIBUTION_CERTIFICATE_BASE64)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(IOS_DISTRIBUTION_CERTIFICATE_PASSWORD)
          [[ -n "$PROFILE_BASE64" ]] || missing+=(IOS_PROVISIONING_PROFILE_BASE64)
          [[ -n "$TEAM_ID" ]] || missing+=(IOS_TEAM_ID)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/mobile-moodle-distribution.p12"
          profile_source="$RUNNER_TEMP/mobile-moodle.mobileprovision"
          profile_plist="$RUNNER_TEMP/mobile-moodle-profile.plist"
          keychain_path="$RUNNER_TEMP/mobile-moodle-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_source"
          [[ -s "$certificate_path" && -s "$profile_source" ]] || {
            echo "Decoded iOS signing asset is empty." >&2
            exit 1
          }

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain_path"

          security cms -D -i "$profile_source" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

          [[ "$profile_team" == "$TEAM_ID" ]] || {
            echo "Provisioning Profile Team ID does not match IOS_TEAM_ID." >&2
            exit 1
          }
          if [[ "$profile_app_id" != "$TEAM_ID.$IOS_BUNDLE_ID" && "$profile_app_id" != "$TEAM_ID.*" ]]; then
            echo "Provisioning Profile does not allow bundle ID $IOS_BUNDLE_ID." >&2
            exit 1
          fi

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile="$profile_dir/$profile_uuid.mobileprovision"
          mkdir -p "$profile_dir"
          cp "$profile_source" "$installed_profile"
          chmod 600 "$installed_profile"

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_path=$installed_profile" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.ios-signing.outputs.profile_name }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          xcodebuild -project ios/ios.xcodeproj -scheme ios
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/MobileMoodle.xcarchive"
          -onlyUsePackageVersionsFromResolvedFile
          MARKETING_VERSION="$RELEASE_VERSION"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          DEVELOPMENT_TEAM="$TEAM_ID"
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          CODE_SIGN_IDENTITY="Apple Distribution"
          archive

      - name: Verify archive signature
        run: >-
          codesign --verify --deep --strict --verbose=2
          "$RUNNER_TEMP/MobileMoodle.xcarchive/Products/Applications/MobileMoodle.app"

      - name: Export and stage IPA
        shell: bash
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.ios-signing.outputs.profile_name }}
          CONFIGURED_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          export_method="${CONFIGURED_EXPORT_METHOD:-release-testing}"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/ipa-export"

          /usr/libexec/PlistBuddy -c 'Clear dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :method string $export_method" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_NAME" "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MobileMoodle.xcarchive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$ipa" && -f "$ipa" ]] || { echo "Exported IPA was not found." >&2; exit 1; }
          unzip -t "$ipa"
          mkdir -p release/ios
          cp "$ipa" "release/ios/mobile-moodle-${GITHUB_REF_NAME}.ipa"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: release/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove Apple signing assets
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.ios-signing.outputs.keychain_path }}
          PROFILE_PATH: ${{ steps.ios-signing.outputs.profile_path }}
        run: |
          [[ -z "$PROFILE_PATH" ]] || rm -f "$PROFILE_PATH"
          if [[ -n "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/mobile-moodle-distribution.p12"
          rm -f "$RUNNER_TEMP/mobile-moodle.mobileprovision"
          rm -f "$RUNNER_TEMP/mobile-moodle-profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"

  release:
    name: Publish GitHub Release
    needs:
      - metadata
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum *.apk *.ipa > SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "Mobile Moodle $GITHUB_REF_NAME" \
              --generate-notes
          fi
