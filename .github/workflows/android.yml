name: Android quality

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    needs: wrapper-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Android checks
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
